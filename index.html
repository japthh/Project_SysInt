<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>
    <link rel="stylesheet" href="style.css">
    <script>
        document.documentElement.style.visibility = "hidden";
        fetch("auth.php", { cache: "no-store" })
            .then(response => {
                if (!response.ok) throw new Error("Unable to check login status.");
                return response.json();
            })
            .then(data => {
                if (!data.authenticated) {
                    window.location.replace("login.html");
                    return;
                }
                const loadStudentApp = () => {
                    const appScript = document.createElement("script");
                    appScript.src = "script.js";
                    document.body.appendChild(appScript);
                };
                const logoutButton = document.getElementById("logoutButton");
                logoutButton.addEventListener("click", async () => {
                    logoutButton.disabled = true;

                    try {
                        const response = await fetch("auth.php?action=logout", { method: "POST" });
                        const result = await response.json();

                        if (!response.ok || !result.success) {
                            throw new Error("Unable to log out. Please try again.");
                        }

                        window.location.replace("login.html");
                    } catch (error) {
                        logoutButton.disabled = false;
                        document.getElementById("message").textContent = error.message;
                    }
                });
                document.documentElement.style.visibility = "visible";
                if (document.readyState === "loading") {
                    document.addEventListener("DOMContentLoaded", loadStudentApp, { once: true });
                } else {
                    loadStudentApp();
                }
            })
            .catch(() => window.location.replace("login.html"));
    </script>
</head>

<body>
    <div>
        <form id="studentForm" action="studentForm">
            <label for="Fullname">Fullname:</label>
            <input type="text" id="Fullname" name="Fullname" required>
            <br>
            <label for="Course">Course:</label>
            <input type="text" id="Course" name="Course" required>
            <br><br>
            <button type="submit">Add Student</button>
            <br>

        </form>
    </div>

    <p id="message"></p>

    <header class="page-header">
        <h1>Student List</h1>
        <button type="button" id="logoutButton">Log out</button>
    </header>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Fullname</th>
                <th>Course</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="studentTable"></tbody>
    </table>

    <main id="studentsDetails"></main>

</body>
</html>
